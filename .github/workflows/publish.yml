name: Publish verified Codex-dafeiyu release
on:
  workflow_dispatch:
    inputs:
      release_version:
        description: Version of the already tested local build, without v
        required: true
        type: string
      source_sha256:
        description: SHA256 of the current source bundle in the draft release
        required: true
        type: string
      portable_sha256:
        description: SHA256 of the tested Windows portable zip
        required: true
        type: string
      source_tree:
        description: Git tree of the current verified source
        required: true
        type: string
permissions:
  contents: write
jobs:
  publish:
    runs-on: windows-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_VERSION: ${{ inputs.release_version }}
      SOURCE_SHA256: ${{ inputs.source_sha256 }}
      PORTABLE_SHA256: ${{ inputs.portable_sha256 }}
      SOURCE_TREE: ${{ inputs.source_tree }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify the current source and tested Windows artifact
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          if ($env:RELEASE_VERSION -notmatch '^\d+\.\d+\.\d+$' -or $env:SOURCE_SHA256 -notmatch '^[a-f0-9]{64}$' -or $env:PORTABLE_SHA256 -notmatch '^[a-f0-9]{64}$' -or $env:SOURCE_TREE -notmatch '^[a-f0-9]{40}$') { throw 'Invalid release metadata' }
          $version = $env:RELEASE_VERSION
          if (git tag -l "v$version") { throw 'Version already tagged; do not republish it' }
          $draft = gh release view "v$version" --json isDraft --jq '.isDraft'
          if ($LASTEXITCODE -ne 0 -or $draft -ne 'true') { throw 'A draft release is required' }
          $dir = Join-Path $env:RUNNER_TEMP "verified-v$version"
          New-Item -ItemType Directory -Path $dir | Out-Null
          $sourceName = "Codex-dafeiyu-v$version-source.bundle"
          $portableName = "Codex-dafeiyu-v$version-windows-x64.zip"
          gh release download "v$version" --pattern $sourceName --dir $dir
          if ($LASTEXITCODE -ne 0) { throw 'Source bundle download failed' }
          gh release download "v$version" --pattern $portableName --dir $dir
          if ($LASTEXITCODE -ne 0) { throw 'Portable artifact download failed' }
          $bundle = Join-Path $dir $sourceName
          $portable = Join-Path $dir $portableName
          if ((Get-FileHash -LiteralPath $bundle -Algorithm SHA256).Hash.ToLower() -ne $env:SOURCE_SHA256) { throw 'Source checksum mismatch' }
          if ((Get-FileHash -LiteralPath $portable -Algorithm SHA256).Hash.ToLower() -ne $env:PORTABLE_SHA256) { throw 'Portable checksum mismatch' }
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $zip = [IO.Compression.ZipFile]::OpenRead($portable)
          try {
            $entry = $zip.GetEntry("Codex-dafeiyu-v$version-windows-x64/resources/app/package.json")
            if (!$entry) { throw 'Missing Windows app metadata' }
            $reader = [IO.StreamReader]::new($entry.Open())
            try { $pkg = $reader.ReadToEnd() | ConvertFrom-Json } finally { $reader.Dispose() }
            if ($pkg.version -ne $version -or $pkg.productName -ne 'Codex-dafeiyu') { throw 'Wrong app version or product name' }
          } finally { $zip.Dispose() }
          git config core.autocrlf false
          git config core.eol lf
          git reset --hard HEAD
          if ($LASTEXITCODE -ne 0) { throw 'Runner checkout normalization failed' }
          git update-index --refresh
          if ($LASTEXITCODE -ne 0 -or (git status --porcelain)) { throw 'Runner checkout is not clean before source import' }
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git bundle verify $bundle
          if ($LASTEXITCODE -ne 0) { throw 'Invalid source bundle or missing prerequisite' }
          git fetch $bundle 'refs/heads/main:refs/remotes/verified/main'
          if ($LASTEXITCODE -ne 0) { throw 'Source import failed' }
          git merge --no-commit --no-ff refs/remotes/verified/main
          if ($LASTEXITCODE -ne 0) { throw 'Source merge needs review; draft remains unpublished' }
          if ((git write-tree).Trim() -ne $env:SOURCE_TREE) { throw 'Imported tree differs from the verified source' }
          if ((Get-Content package.json -Raw | ConvertFrom-Json).version -ne $version) { throw 'Source version mismatch' }
          if (git diff --cached --name-only -- .github/workflows) { throw 'Workflow files must be updated through the web editor first' }
          git commit -m "Release Codex-dafeiyu v$version from verified local source and artifact"
          if ($LASTEXITCODE -ne 0) { throw 'Source commit failed' }
          git push origin HEAD:main
          if ($LASTEXITCODE -ne 0) { throw 'Source push failed; draft remains unpublished' }
          "RELEASE_COMMIT=$((git rev-parse HEAD).Trim())" >> $env:GITHUB_ENV
      - name: Publish the verified draft without rebuilding
        shell: pwsh
        run: |
          gh release edit "v$env:RELEASE_VERSION" --target $env:RELEASE_COMMIT --draft=false --latest --notes-file CHANGELOG.md
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
