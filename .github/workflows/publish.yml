name: Build and publish Codex-dafeiyu v1.3.3
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  publish:
    runs-on: windows-latest
    timeout-minutes: 20
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24.19.0
      - name: Apply verified naming changes
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          if ((Get-Content package.json -Raw | ConvertFrom-Json).version -eq '1.3.2') {
            git config core.autocrlf false
            git checkout-index --force --all
            $patch = Join-Path $env:RUNNER_TEMP 'rename-v1.3.3.patch'
            [IO.File]::WriteAllBytes($patch, [Convert]::FromBase64String(''))
            if ((Get-FileHash -LiteralPath $patch -Algorithm SHA256).Hash.ToLower() -ne 'a78248569c66dc23376485e259b8eb661dc2b5c61946ad885699040b92bec621') { throw 'Naming patch checksum mismatch' }
            git apply --check $patch
            if ($LASTEXITCODE -ne 0) { throw 'Naming patch does not match the source' }
            git apply --whitespace=nowarn $patch
            if ($LASTEXITCODE -ne 0) { throw 'Naming patch could not be applied' }
          }
          if ((Get-Content package.json -Raw | ConvertFrom-Json).version -ne '1.3.3') { throw 'Unexpected source version' }
      - name: Install locked dependencies
        shell: pwsh
        run: |
          npm ci --ignore-scripts=false --no-audit --no-fund
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm --prefix backend ci --legacy-peer-deps --ignore-scripts --no-audit --no-fund
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Build and run 122 checks
        shell: pwsh
        run: |
          npm run build
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm test
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm run test:backend
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Build the renamed portable package
        shell: pwsh
        run: |
          npm run package:win
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $exe = Get-Item 'dist/Codex-dafeiyu-v1.3.3-windows-x64/Codex-dafeiyu.exe'
          if ($exe.VersionInfo.ProductName -ne 'Codex-dafeiyu') { throw 'Wrong executable product name' }
      - name: Commit the verified source and publish v1.3.3
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add --all
          git diff --cached --quiet
          if ($LASTEXITCODE -eq 1) {
            git commit -m 'Rename project and Windows app to Codex-dafeiyu; release v1.3.3'
            if ($LASTEXITCODE -ne 0) { throw 'Source commit failed' }
            git push origin HEAD:main
            if ($LASTEXITCODE -ne 0) { throw 'Source push failed' }
          }
          $commit = (git rev-parse HEAD).Trim()
          $dir = Join-Path $env:GITHUB_WORKSPACE 'dist'
          $zip = Join-Path $dir 'Codex-dafeiyu-v1.3.3-windows-x64.zip'
          Compress-Archive -Path (Join-Path $dir 'Codex-dafeiyu-v1.3.3-windows-x64') -DestinationPath $zip -CompressionLevel Optimal
          $hash = (Get-FileHash -LiteralPath $zip -Algorithm SHA256).Hash.ToLower()
          $sums = Join-Path $dir 'SHA256SUMS.txt'
          [IO.File]::WriteAllText($sums, "$hash  Codex-dafeiyu-v1.3.3-windows-x64.zip`n", [Text.UTF8Encoding]::new($false))
          gh release create v1.3.3 --target $commit --title 'Codex-dafeiyu v1.3.3' --notes-file CHANGELOG.md --latest $zip $sums
          if ($LASTEXITCODE -ne 0) { throw 'Release publishing failed' }
