name: Build and release Codex-dafeiyu
on:
  workflow_dispatch:
    inputs:
      publish:
        description: Publish the verified version to GitHub Releases
        type: boolean
        default: false
permissions:
  contents: write
jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 20
    env:
      GH_TOKEN: ${{ github.token }}
      PUBLISH_RELEASE: ${{ inputs.publish }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check version and native build requirements
        id: version
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $pkg = Get-Content package.json -Raw | ConvertFrom-Json
          $version = $pkg.version
          $shell = Get-Content app-shell/package.json -Raw | ConvertFrom-Json
          if ($version -notmatch '^\d+\.\d+\.\d+$' -or $version -ne $shell.version) { throw 'Package versions are inconsistent' }
          if (!(Get-Content app-shell/panel.html -Raw).Contains("v$version ·")) { throw 'Panel version is inconsistent' }
          $compiler = Join-Path $env:WINDIR 'Microsoft.NET/Framework64/v4.0.30319/csc.exe'
          if (!(Test-Path -LiteralPath $compiler)) { throw 'Windows C# compiler is missing' }
          if ($env:PUBLISH_RELEASE -eq 'true' -and (git tag -l "v$version")) { throw 'Version tag already exists; bump the version first' }
          "version=$version" >> $env:GITHUB_OUTPUT
          "electron=$($pkg.devDependencies.electron)" >> $env:GITHUB_OUTPUT
      - uses: actions/setup-node@v4
        with:
          node-version: 24.19.0
          cache: npm
          cache-dependency-path: |
            package-lock.json
            backend/package-lock.json
      - uses: actions/cache@v4
        with:
          path: ~/AppData/Local/electron/Cache
          key: ${{ runner.os }}-electron-${{ steps.version.outputs.electron }}
      - name: Install locked dependencies
        shell: pwsh
        run: |
          npm ci --ignore-scripts=false --no-audit --no-fund
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm --prefix backend ci --legacy-peer-deps --ignore-scripts --no-audit --no-fund
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Build and check the current source
        shell: pwsh
        run: |
          npm run build
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm test
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm run test:backend
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Package Windows app and checksum
        shell: pwsh
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
        run: |
          $ErrorActionPreference = 'Stop'
          npm run package:win
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $name = "Codex-dafeiyu-v$env:RELEASE_VERSION-windows-x64"
          $exe = Get-Item "dist/$name/Codex-dafeiyu.exe"
          if ($exe.VersionInfo.ProductName -ne 'Codex-dafeiyu' -or $exe.VersionInfo.ProductVersion -ne $env:RELEASE_VERSION) { throw 'Executable metadata does not match the release' }
          Compress-Archive -Path "dist/$name" -DestinationPath "dist/$name.zip" -CompressionLevel Optimal
          $hash = (Get-FileHash -LiteralPath "dist/$name.zip" -Algorithm SHA256).Hash.ToLower()
          [IO.File]::WriteAllText("$env:GITHUB_WORKSPACE/dist/SHA256SUMS.txt", "$hash  $name.zip`n", [Text.UTF8Encoding]::new($false))
      - uses: actions/upload-artifact@v4
        with:
          name: Codex-dafeiyu-v${{ steps.version.outputs.version }}-windows-x64
          path: |
            dist/*.zip
            dist/SHA256SUMS.txt
          compression-level: 0
      - name: Publish the verified artifact
        if: ${{ inputs.publish }}
        shell: pwsh
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
        run: |
          gh release create "v$env:RELEASE_VERSION" --target $env:GITHUB_SHA --title "Codex-dafeiyu v$env:RELEASE_VERSION" --notes-file CHANGELOG.md --latest "dist/Codex-dafeiyu-v$env:RELEASE_VERSION-windows-x64.zip" dist/SHA256SUMS.txt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
